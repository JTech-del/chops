<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <script>
      (() => {
        const storageKey = 'chops-theme';
        const storedTheme = localStorage.getItem(storageKey);

        const systemPrefersDark =
          window.matchMedia &&
          window.matchMedia(
            '(prefers-color-scheme: dark)',
          ).matches;

        const theme =
          storedTheme === 'light' ||
          storedTheme === 'dark'
            ? storedTheme
            : systemPrefersDark
              ? 'dark'
              : 'light';

        document.documentElement.setAttribute(
          'data-theme',
          theme,
        );
      })();
    </script>

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#faf8f5"
    />

    <title>Chops — Good Food. Good Mood.</title>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
